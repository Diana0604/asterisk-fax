[hello]
exten=>hello,1,Verbose(1, hello world call)
same=>n,Wait(5)
same=>n,Playback(/fax/sounds/phone/1_hello_whatuthinkofaudio)
same => n,MixMonitor(/fax/sounds/phone/output/output.wav)
same => n,Wait(20)
same=>n,StopMixMonitor()
same =>n,Set(DB(DRHA/questionnaire)=0)
same=>n,Wait(61)
same=>n,Gosub(questionnaire,q1,1) ;go to [questionnaire] -> question 1 , 1
same=>n,Hangup()

exten=>infinitescroll,1,Verbose(1, inf scroll call)
same => n,SendFax(/fax/tifs/nua/guesswhofrompptx.tif)
;same => n,SendFax(/fax/tifs/tester.tif)
same=>n,Hangup()

